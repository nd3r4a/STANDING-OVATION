# Static site: no framework, no secrets in this file.
# Sensitive values (if a backend is ever added) belong in the Netlify UI, never here or in Git.
[build]
  publish = "."
  # Fails the deploy if any Paystack link differs from the approved one or a security check fails.
  command = "npm run security"

[build.environment]
  NODE_VERSION = "22"

# Universal Amazon link: /amazon sends each visitor to their country's store (US store if none).
# Rules run top to bottom and the first match wins, so the unconditional US rule must stay last.
[[redirects]]
  from = "/amazon"
  to = "https://www.amazon.co.uk/dp/9786705181"
  status = 302
  force = true
  conditions = {Country = ["GB"]}

